nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          !
          ! In order to avoid entering a configuration dialog on boot, please
          ! ensure that all interfaces have some IP configuration present here
          ! such as the example below:
          !
          interface range Ethernet 0/0 - 3
           no ip address
           shutdown
          !
          no logging console
          no ip domain lookup
          !
          !
          interface e0/0
           no shut
           ip address 10.4.1.1 255.255.255.0
          interface e0/1
           no shut
           ip address 10.1.101.1 255.255.255.0
          interface e0/2
           no shut
           ip address 10.1.102.1 255.255.255.0
          interface e0/3
           no shut
           ip address 10.1.103.1 255.255.255.0
          !
          interface loop0
           ip address 192.168.0.1 255.255.255.255
          interface loop1
           ip address 192.168.10.1 255.255.255.255
          !
          !
          ip dhcp pool Desktop
           network 10.5.10.0 /24
           default-router 10.5.10.1
           domain-name example.com
           lease 0 12
           exit
          ip dhcp pool Branch
           network 10.5.50.0 /24
           default-router 10.5.50.1
           domain-name example.com
           lease 0 12
           exit
          !
          ip dhcp excluded-address 10.5.10.1 10.5.10.10
          ip dhcp excluded-address 10.5.50.1 10.5.50.10
          !
          end
