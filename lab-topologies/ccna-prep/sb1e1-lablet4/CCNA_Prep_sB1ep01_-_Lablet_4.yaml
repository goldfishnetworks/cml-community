lab:
  description: |-
    This is a practice CCNA Exam Lablet designed to test skills on configuration, operations, and troubleshooting tasks from the CCNA Blueprint.

    Find the list of tasks to complete in the CML Lab Guide, and use console access to the devices and apply configurations.
  notes: |-
    Update configurations by performing the following tasks:

    **Task 1: Network Access**

    * Create VLANs on **Sw5** using data from the table.
    * Configure **Sw5** interface e0/1 as an access port in the *Branch* VLAN
    * Configure **Sw5** interfaces e1/0-3 for:
        * Data VLAN - *Desktops*
        * Voice VLAN - *VoIP*

    **Task 2: Dynamic Routing**

    *Note: **R2** is correctly pre-configured for OSPF and this task.*

    * Enable IPv4 OSPFv2 on **R1** and **Sw5** using process id 1.
    * Ensure each OSPF router uses its *Loopback0* address as the Router ID.
    * Configure OSPF routers to advertise all connected networks into area 0.
        * *Note: Connected networks includes all physical, VLAN, and Loopback interfaces with IP addresses configured.*
    * Ensure only **R1** and **R2** can ever be the designated router.
        * **R1** must have the best chance of becoming the designated router.
    * Configure **Sw5** so that it only attempts building OSPF adjacencies on interface e0/0

    **Task 3: Layer 2 Security**

    * Enable DHCP snooping on **Sw5** for the *Branch* and *Desktops* VLANs
    * Ensure **Sw5** drops traffic from DHCP clients if the source MAC address doesn't match the snooped MAC address

    **Task 4: DHCP**

    *Note: **R1** is pre-configured as a DHCP server. Do NOT change any configuration on **R1** for this task.*

    * Configure **Sw5** to forward DHCP requests from the *Branch* and *Desktops* VLANs to **R1** Loopback1 address.
    * Configure **Branch-7** to use DHCP to assign an IPv4 address on interface e0/0.
    * Ensure **Branch-7** uses the default route provided by DHCP.
  title: CCNA Prep sB1ep01 - Lablet 4
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
