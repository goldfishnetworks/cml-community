lab:
  description: |-
    This is a practice CCNA Exam Lablet designed to test skills on configuration, operations, and troubleshooting tasks from the CCNA Blueprint.

    Find the list of tasks to complete in the CML Lab Guide, and use console access to the devices and apply configurations.
  notes: |-
    Update the configuration on **Sw1** to complete the following tasks:

    **Task 1: IPv4 Addressing**

    * Configure IPv4 addresses on Sw1 interfaces using the data from table.

    **Task 2: Network Appliance Connectivity**

    * Configure the interface to WLC01 as an 802.1Q Trunk using the data from table.
    * Ensure only mgmt, guest, and user VLAN traffic transmits across the trunk.
    * Ensure mgmt traffic remains untagged across the trunk.

    **Task 3: Static Routing**

    * Configure a static default route through R1.
    * Use a metric of 10 to add a backup static default route through R2.
    * Use the next-hop IP addresses for all static routes.

    **Task 4: Access Control Lists**

    * Create and apply an ACL numbered 101 to an interface preventing telnet traffic from Server01 to reach the WLC01 mgmt address.
        * All other traffic must be allowed.
    * Ensure the ACL is only applied to a single interface.

    *Note: Server01 is available for testing and verification. No configuration should be changed on Server01.*
  title: CCNA Prep sB1ep01 - Lablet 1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
