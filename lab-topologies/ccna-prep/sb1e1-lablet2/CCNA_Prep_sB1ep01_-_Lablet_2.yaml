lab:
  description: |-
    This is a practice CCNA Exam Lablet designed to test skills on configuration, operations, and troubleshooting tasks from the CCNA Blueprint.

    Find the list of tasks to complete in the CML Lab Guide, and use console access to the devices and apply configurations.
  notes: |-
    Update configurations on **R1** and **Sw2** by performing the following tasks:

    *Note: The two desktop hosts are available for testing and verification of work. Server1 can be used as a destination for tests using ping, telnet, and SSH clients from the desktops. Do not change configuration on these hosts.*

    **Task 1: Layer 2 Network Segmentation**

    * Create VLANs from the table on Sw2.
    * Configure network access for the desktop hosts, do not use trunking

    **Task 2: Inter-VLAN Routing**

    * Configure an 802.1Q trunk between R1 and Sw2.
    * Verify the default VLAN is untagged on the trunk
    * Configure R1 to provide inter-VLAN routing between all networks listed in the table

    **Task 3: Network Address Translation**

    * Configure R1 to translate traffic from Sw2 networks to the "Internet"using interface PAT.
        * Use pre-configured Access-list 10 to identify traffic to be translated. Do not modify this ACL
    * Verify R1's interface IP address is the Inside Global IP address for all translated traffic

    **Task 4: IPv6 Connectivity**

    * Configure IPv6 addresses on R1 interfaces using information below
    * Configure a static IPv6 default route to the global unicast address on Internet interface E0/1
    * Ensure IPv6 connectivity to Server1 using ping from R1.

    <table style="width: 100%;">
        <thead style="background-color: #b6b5b5;">
            <tr>
                <th>Device</th>
                <th>Interface</th>
                <th>IPv6 Address</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Internet</td>
                <td>Eth0/1</td>
                <td>fe80::1/10</td>
            </tr>
            <tr style="background-color: #dfdfdf;">
                <td>Internet</td>
                <td>Eth0/1</td>
                <td>2001:db8:1::1/64</td>
            </tr>
            <tr>
                <td>R1</td>
                <td>Eth0/1</td>
                <td>2001:db8:1::/64 EUI 64</td>
            </tr>
            <tr style="background-color: #dfdfdf;">
                <td>R1</td>
                <td>Eth0/0</td>
                <td>fe80::1/10</td>
            </tr>
            <tr>
                <td>R1</td>
                <td>Eth0/0</td>
                <td>2001:db8:10::1/64</td>
            </tr>
        </tbody>
    </table>
  title: CCNA Prep sB1ep01 - Lablet 2
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
